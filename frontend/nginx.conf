server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 30m;   # email attachments (the API allows up to 25 MB)

  # API calls go to the FastAPI container ("api" in docker-compose.yml)
  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # React app: unknown paths fall back to index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
