# Starts the whole app: PostgreSQL (tables and home-page views from database/), the CRM API,
# the React frontend and a test mailbox for the emails the app sends.
#   docker compose up --build
#   App:         http://localhost:5173   (sign up, then log in)
#   API docs:    http://localhost:8001/docs
#   Test inbox:  http://localhost:8026   (every email the app sends lands here, nothing goes out)
#   PostgreSQL:  localhost:5433  (user crm_user / crm_pass, database crm_db)
# Start fresh (empty database):  docker compose down -v && docker compose up --build
name: crm-app

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: crm_pass
      POSTGRES_DB: crm_db
      TZ: America/New_York     # same clock for PostgreSQL and the API, so "today" matches
      PGTZ: America/New_York
    ports:
      - "5433:5432"
    volumes:
      - crm_pg_data:/var/lib/postgresql/data
      # run in this order on the first start only (create-user.sql is not needed: POSTGRES_USER/DB above create them).
      # seed-data.sql is not loaded: the app starts empty and users sign up.
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/home-page-views.sql:/docker-entrypoint-initdb.d/02-home-page-views.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_user -d crm_db"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build: ./backend
    environment:
      # One shared database for every login. To share one database between several computers,
      # set DATABASE_URL in .env to that PostgreSQL server (see .env.example).
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://crm_user:crm_pass@db:5432/crm_db}
      FRONTEND_URL: ${APP_URL:-http://localhost:5173}
      APP_URL: ${APP_URL:-http://localhost:5173}       # link in notification emails
      # Mail: the test inbox (mailpit) unless a .env file next to this file sets a real server (see .env.example)
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_TLS: ${SMTP_TLS:-false}
      MAIL_FROM: ${MAIL_FROM:-crm@salestrack.local}
      COMPANY_NAME: ${COMPANY_NAME:-}   # shown to customers in the lead welcome email
      # Outlook / Microsoft 365 with OAuth instead of an SMTP password (see .env.example)
      MAIL_PROVIDER: ${MAIL_PROVIDER:-smtp}
      MS_TENANT_ID: ${MS_TENANT_ID:-}
      MS_CLIENT_ID: ${MS_CLIENT_ID:-}
      MS_CLIENT_SECRET: ${MS_CLIENT_SECRET:-}
      # Login: the default Admin created on the first start, and the key that signs login tokens
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@salestrack.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@2026}
      SECRET_KEY: ${SECRET_KEY:-salestrack-dev-secret-change-me}
      TZ: America/New_York     # same clock for PostgreSQL and the API, so "today" matches
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8026:8025"   # web inbox

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  crm_pg_data:
