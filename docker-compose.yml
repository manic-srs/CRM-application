# Starts the whole app: PostgreSQL (schema, home-page views and sample data from database/),
# the CRM API and the React frontend.
#   docker compose up --build
#   App:         http://localhost:5173
#   API docs:    http://localhost:8001/docs
#   PostgreSQL:  localhost:5433  (user crm_user / crm_pass, database crm_db)
# Start fresh (reload the SQL files):  docker compose down -v && docker compose up --build
name: crm-app

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: crm_pass
      POSTGRES_DB: crm_db
      TZ: America/New_York     # same clock for PostgreSQL and the API, so "today" matches
      PGTZ: America/New_York
    ports:
      - "5433:5432"
    volumes:
      - crm_pg_data:/var/lib/postgresql/data
      # run in this order on the first start only (create-user.sql is not needed: POSTGRES_USER/DB above create them)
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/home-page-views.sql:/docker-entrypoint-initdb.d/02-home-page-views.sql:ro
      - ./database/seed-data.sql:/docker-entrypoint-initdb.d/03-seed-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_user -d crm_db"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://crm_user:crm_pass@db:5432/crm_db
      FRONTEND_URL: http://localhost:5173
      TZ: America/New_York     # same clock for PostgreSQL and the API, so "today" matches
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  crm_pg_data:
