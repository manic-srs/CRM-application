# Starts MySQL and the CRM API together:   docker compose up --build
# API docs:  http://localhost:8001/docs
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root        # local testing only
      MYSQL_DATABASE: crm_db
    ports:
      - "3307:3306"                    # MySQL on your Mac at localhost:3307
    volumes:
      - mysql_data:/var/lib/mysql      # keeps data between restarts
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    environment:
      DATABASE_URL: mysql+pymysql://root:root@db:3306/crm_db
    ports:
      - "8001:8000"                    # CRM API on your Mac at localhost:8001 (8000 is used by another project)
    depends_on:
      db:
        condition: service_healthy     # waits until MySQL is ready

volumes:
  mysql_data:
